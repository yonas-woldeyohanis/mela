name: swiftreceipt
description: Offline-first payment receipt capture, sync and reconciliation.
publish_to: none
version: 1.0.6+2007

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_barcode_scanning: ^0.12.1
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
